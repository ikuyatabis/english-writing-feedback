name: Teachers clinic compatibility QA
on:
  push:
    branches: [main]
    paths:
      - "misc/index.html"
      - ".github/workflows/teachers-compatibility-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ikuyatabis/teachers
          ref: main
          path: teachers-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check teacher site against this clinic revision
        env:
          CLINIC_HTML: misc/index.html
        run: node --test teachers-source/tests/*.test.mjs
