name: Summary workshop QA

on:
  push:
    branches: [main]
    paths:
      - "sum/**"
      - "index.html"
      - "tests/sum-*.cjs"
      - "tests/yorinuki-content-boundary-cases.md"
      - "buncan/index.html"
      - ".github/workflows/summary-qa.yml"
  pull_request:
    paths:
      - "sum/**"
      - "index.html"
      - "tests/sum-*.cjs"
      - "tests/yorinuki-content-boundary-cases.md"
      - "buncan/index.html"
      - ".github/workflows/summary-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run native Node regression tests
        run: node --test tests/sum-*.test.cjs

  chromium-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium for Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile browser layouts
        run: node tests/sum-browser.cjs
      - name: Keep screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorinuki-browser-screenshots
          path: test-artifacts/*.png
          if-no-files-found: warn
